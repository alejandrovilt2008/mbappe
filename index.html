<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Encuentra la Palabra</title>

    <!-- Google Fonts -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->

    <link
        rel="stylesheet"
        href="css/style.css">

</head>

<body>

<!--==================================================
LOGO
===================================================-->

<header>

    <img
        id="logo"
        src="img/logo.png"
        alt="Logo Encuentra la Palabra">

    <h1>
        Encuentra la Palabra
    </h1>

</header>

<!--==================================================
CONTENEDOR PRINCIPAL
===================================================-->

<main>

<!--==================================================
PANTALLA DE INICIO
===================================================-->

<section
    id="inicio-container"
    class="container">

    <h2>
        ¡Bienvenido!
    </h2>

    <p class="descripcion">

        Aprende nuevas palabras mientras te diviertes.

    </p>

    <button
        onclick="mostrarLogin()">

        🚀 Comenzar

    </button>

</section>

<!--==================================================
LOGIN
===================================================-->

<section
    id="login-container"
    class="container"
    style="display:none;">

    <h2>
        Iniciar sesión
    </h2>

    <input
        type="email"
        id="email"
        placeholder="Correo electrónico"
        autocomplete="email">

    <input
        type="password"
        id="password"
        placeholder="Contraseña"
        autocomplete="current-password">

    <button onclick="login()">

        Iniciar sesión

    </button>

    <button onclick="register()">

        Registrarse

    </button>

    <p
        id="auth-message">

    </p>

</section>
    <!-- ========================================= -->
<!-- LOBBY -->
<!-- ========================================= -->

<div id="lobby-container" class="container" style="display:none;">

    <h2>🎮 Selecciona un tema</h2>

    <div class="perfil">

        <div class="avatar">
            👤
        </div>

        <div class="datos">
            <h3 id="usuario">Usuario</h3>
            <p>¡Bienvenido nuevamente!</p>
        </div>

    </div>

    <div class="estadisticas">

        <div class="stat">
            ⭐
            <span id="nivel">Nivel 1</span>
        </div>

        <div class="stat">
            🏆
            <span id="puntajeTotal">0 pts</span>
        </div>

    </div>

    <div class="grid-temas">

        <button class="tema-btn"
                onclick="seleccionarTema('tecnologia')">

            💻

            <span>Tecnología</span>

        </button>

        <button class="tema-btn"
                onclick="seleccionarTema('paises')">

            🌎

            <span>Países</span>

        </button>

        <button class="tema-btn"
                onclick="seleccionarTema('animales')">

            🐶

            <span>Animales</span>

        </button>

        <button class="tema-btn"
                onclick="seleccionarTema('frutas')">

            🍎

            <span>Frutas</span>

        </button>

        <button class="tema-btn"
                onclick="seleccionarTema('deportes')">

            ⚽

            <span>Deportes</span>

        </button>

        <button class="tema-btn"
                onclick="seleccionarTema('comida')">

            🍔

            <span>Comida</span>

        </button>

    </div>

    <button
        class="cerrar-btn"
        onclick="cerrarSesion()">

        🚪 Cerrar sesión

    </button>

</div>
    <!-- ========================================= -->
<!-- PANTALLA DEL JUEGO -->
<!-- ========================================= -->

<div id="game-container"
     class="container"
     style="display:none;">

    <!-- Tema -->

    <h2 id="tema-actual"></h2>

    <!-- Tarjeta de pista -->

    <div class="card-pista">

        <p>Pista</p>

        <h1 id="pista"></h1>

    </div>

    <!-- Cronómetro -->

    <p id="contador">
        ⏱ 30 segundos
    </p>

    <!-- Barra de progreso -->

    <div class="barra">

        <div id="barra-progreso"></div>

    </div>

    <!-- Caja de respuesta -->

    <input
        type="text"
        id="respuesta"
        placeholder="Escribe la palabra">

    <!-- Botón verificar -->

    <button
        onclick="verificar()">

        ✔ Verificar

    </button>

    <!-- Resultado -->

    <p id="resultado"></p>

    <!-- Puntaje -->

    <p id="puntaje">

        Puntaje: 0

    </p>

    <!-- Estrella de recompensa -->

    <div id="estrella">

        🌟

    </div>

    <!-- Botones inferiores -->

    <div class="acciones-juego">

        <button
            class="volver-btn"
            onclick="volverLobby()">

            ⬅ Volver

        </button>

        <button
            class="reiniciar-btn"
            onclick="reiniciarNivel()">

            🔄 Reiniciar

        </button>

    </div>

</div>
    <!-- ========================================= -->
<!-- FIN DEL CONTENIDO -->
<!-- ========================================= -->

<!-- JavaScript principal -->

<script src="js/app.js"></script>

</body>
</html>
