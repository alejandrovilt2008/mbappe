
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ranking definitivo de Feid</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 20px;
  background: #101010;
  color: white;
  font-family: Arial, sans-serif;
}
.container { max-width: 850px; margin: auto; }
h1 { text-align: center; color: #00e5a0; }
.subtitle { text-align: center; color: #bbb; }
.tabs {
  display: flex;
  gap: 8px;
  margin: 25px 0;
}
.tabs button, .action {
  flex: 1;
  padding: 13px 8px;
  border: 0;
  border-radius: 10px;
  background: #292929;
  color: white;
  font-weight: bold;
  cursor: pointer;
}
.tabs button.active { background: #00b982; color: #071b14; }
.panel {
  background: #1c1c1c;
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 18px;
}
.hidden { display: none; }
.duel {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin: 25px 0;
}
.song {
  min-height: 120px;
  padding: 18px 10px;
  border: 2px solid #00d99a;
  border-radius: 15px;
  background: #242424;
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  overflow-wrap: anywhere;
}
.song:active { background: #007d59; }
.info { text-align: center; color: #bbb; }
.progress {
  height: 9px;
  background: #444;
  border-radius: 10px;
  overflow: hidden;
}
.bar { height: 100%; width: 0%; background: #00e5a0; }
.action { margin-top: 10px; }
.action.green { background: #00b982; color: #071b14; }
.ranking-item {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 12px;
  margin: 7px 0;
  background: #292929;
  border-radius: 9px;
}
.rank { color: #00e5a0; font-weight: bold; }
input {
  width: 100%;
  padding: 13px;
  border: 0;
  border-radius: 9px;
  margin: 10px 0;
  font-size: 16px;
}
@media(max-width:500px) {
  body { padding: 12px; }
  .duel { gap: 8px; }
  .song { font-size: 15px; min-height: 115px; }
  .tabs button { font-size: 12px; }
}
</style>
</head>
<body>
<div class="container">
  <h1>FERXXO 🟢</h1>
  <p class="subtitle">El ranking definitivo de las 199 canciones de Feid</p>

  <div class="tabs">
    <button class="active" onclick="showTab('battle',this)">⚔️ Batallas</button>
    <button onclick="showTab('ranking',this)">🏆 Ranking</button>
    <button onclick="showTab('songs',this)">🎵 Canciones</button>
  </div>

  <section id="battle" class="panel">
    <h2>Elige tu favorita</h2>
    <p class="info" id="counter">Duelo 1</p>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div class="duel">
      <button class="song" id="songA" onclick="choose(0)">Cargando...</button>
      <button class="song" id="songB" onclick="choose(1)">Cargando...</button>
    </div>
    <p class="info" id="message">Pulsa una canción para elegir la ganadora.</p>
    <button class="action" onclick="undo()">↩ Deshacer última elección</button>
    <button class="action" onclick="skip()">Saltar duelo</button>
  </section>

  <section id="ranking" class="panel hidden">
    <h2>🏆 Ranking en vivo</h2>
    <p class="info">El ranking se actualiza con tus elecciones.</p>
    <input id="rankSearch" placeholder="Buscar canción..." oninput="renderRanking()">
    <div id="rankingList"></div>
    <button class="action green" onclick="downloadCSV()">Descargar ranking CSV</button>
  </section>

  <section id="songs" class="panel hidden">
    <h2>🎵 Las canciones</h2>
    <input id="songSearch" placeholder="Buscar canción..." oninput="renderSongs()">
    <div id="songList"></div>
  </section>
</div>

<script>
const songs = [
"Read My Lips","LA INOCENTE","dembowpopsexyTROPICAL","Buena Mala",
"badwine","Quiero","Sígueme - Remix","Subiendo","Ven Pa Casa","FKU",
"Ron","Ven Pa Casa_RGT","Trampa","Con Tu Body","911","Morena",
"badwine - Extended Remix","enemigos","FOTOGRAFÍAS","JAMAICA",
"BREAK UP","que putas","FERXXO X ÑEJO","XX - Remix","NEA","otra vez",
"PORFA - Remix","confesión","Conmigo","Que vuelta vox","El Hexxo",
"La Mejor Música","Medellín Takai","TRANKAITO","Boleritoxx",
"SE LO JURO MOR","A Xon De Que","BORRAXXO Te Esperaré","PARADIXE",
"SE PUSO FEO","HAXTA EL DIA FINAL","DE DIOR XL","TIEMPO SIN VXRTX",
"PENXAMIENTOS DE MADRUGADA","PIENXA EN MI","they already know",
"Los Cuervos","50 MIL PIEX","RECREO","Castigo","Feliz Cumpleaños Ferxxo",
"Nieve","Ferxxo 100","Belixe","XQ Te Pones Así","X20X","Prohibidox",
"Lady Mi Amor","Quemando Calorías","Aguante","Si Te La Encuentras Por Ahí",
"Normal","La Buena Fai","ALAKRAN","50 PALOS","LA VUELTA","CUAL ES ESA",
"INTERLUDE","LUNA","ESQUIRLA","DESQUITE","YO AK","CLASSY 101","XX",
"ATEO","XNTXS","FRESH KERIAS","PORFA","BORRAXXA","CUUUUUX","X19X",
"RELXJXTE","VIDEITOXX","EXCXSXS","MORXX","EL CUARTO DE FERXXO",
"TX VXS","PERREOXOXO","AVXNTADXR","Caferxxo","I MIXX U","DALLAX",
"PIDA LO QUE QUIERA MAMI","KELOIDE","NO ME DEJO XXIMBIAR",
"NOS DESCONOXIMOS","S4TM (Slow and Reverb)","Ferxxo 500","TGIF",
"hypnotixx","RU MOR","ANDO XXIL","La rebuena mi fai","Priority",
"SORRY 4 THAT MUCH - Bonus Track","CORONE","CHIMBITA","TENGO FE",
"COMO CUANDO","JORDAN IV","FUMETEO","PURRITO APA","XXXX","FERXXO VI",
"HULU","HECTOL","EL PADRINO","TE MATA","14 de Febrero","Si Tú Supieras",
"VACAXIONES","FRIKI","MONASTERY","COMMENT","8 DIAX","RUDEBOYZ",
"AMOR DE MI VIDA","FUMETEO - Remix","MIONCA AL BLOQUE","LA RESPUESTA",
"ESTOY PUTIAO","PPCP","1XXX RAXONES","MONI","DE REPENTE","AGAIN",
"KLKHAY","OLD NAVY","11 PM EN ST. REGIS","DE NEGRO","BRICKELL",
"NO DIGAS NA","PA JANGUIAR","VOL. 2","FERXXO 30","VENTE CONMIGO",
"NIÑA BONITA","GANGSTERS Y PISTOLAS","FERXXO 151","BUBALU",
"RITMO DE MEDALLO","FERXXO EDITION","NX TX SIENTAS SOLX","EY CHORY",
"LUCES DE TECNO","VELOCIDAD CRUCERO","EL ÚNICO TEMA DEL FERXXO",
"ROMÁNTICOS DE LUNES","PRIVILEGIOS","MXFIX G5","NUESTRA CANCIÓN",
"PARADIXE - REMIX","QUÉ RARO","REMIX EXCLUSIVO","LA PASAMOS CXBRXN",
"CHORRITO DE PA' LAS ÁNIMAS","MALIBÚ","CALIFORNIA","HOOKIA",
"LE PIDO A DIOS","VERANO ROSA","+57","MOJANDO ASIENTOS","PERRO NEGRO",
"SI SABE FERXXO","PANTYSITO","LLORIPARI","GATITAS SANDUNGUERAS VOL. 1",
"MÍRAME BABY","SUEÑOS PERDIDOS (REMIX)","CUADERNO","PA MI (REMIX)",
"BELLO LOVE","CHICA 305","X TI","CAMBIARÉ","TE ENTIENDO (REMIX)",
"SE ME OLVIDA (BONUS TRACK)","HEY MOR","QUERIDA","ULTRA SOLO (REMIX)",
"MENTIRA","POLARIS (REMIX)","NOCHE WITHOUT YOU","EL CIELO","LA BABY",
"YANDEL 150","YANKEE 150","OFFLINE"
];

let ratings = {};
let counts = {};
let history = [];
let current = null;
let seen = {};
let duelNumber = 0;

function load() {
  try {
    const saved = JSON.parse(localStorage.getItem("feid-ranking-v2"));
    if(saved && saved.ratings) {
      ratings = saved.ratings;
      counts = saved.counts || {};
      history = saved.history || [];
      seen = saved.seen || {};
      duelNumber = saved.duelNumber || 0;
    }
  } catch(e) {}
  songs.forEach(s => {
    if(ratings[s] === undefined) ratings[s] = 1500;
    if(counts[s] === undefined) counts[s] = 0;
  });
}
function save() {
  localStorage.setItem("feid-ranking-v2", JSON.stringify({
    ratings,counts,history,seen,duelNumber
  }));
}
function pickDuel() {
  const sorted = [...songs].sort((a,b) => {
    return counts[a] - counts[b] || Math.random() - .5;
  });
  const a = sorted[0];
  let candidates = songs.filter(s =>
    s !== a && (seen[[a,s].sort().join("|")] || 0) < 2
  );
  candidates.sort((x,y) =>
    Math.abs(ratings[a]-ratings[x]) -
    Math.abs(ratings[a]-ratings[y])
  );
  const b = candidates[0] || songs.find(s => s !== a);
  return [a,b];
}
function nextDuel() {
  current = pickDuel();
  document.getElementById("songA").textContent = current[0];
  document.getElementById("songB").textContent = current[1];
  document.getElementById("counter").textContent = "Duelo " + (duelNumber+1);
  document.getElementById("bar").style.width =
    Math.min(100, duelNumber/300*100) + "%";
  document.getElementById("message").textContent =
    "¿Cuál te gusta más?";
}
function choose(index) {
  if(!current) return;
  const winner = current[index];
  const loser = current[1-index];
  const key = [winner,loser].sort().join("|");
  const oldWinner = ratings[winner];
  const oldLoser = ratings[loser];
  const expected = 1/(1+Math.pow(10,(oldLoser-oldWinner)/400));
  const change = 32*(1-expected);
  ratings[winner] += change;
  ratings[loser] -= change;
  counts[winner]++;
  counts[loser]++;
  seen[key] = (seen[key] || 0)+1;
  history.push({winner,loser,oldWinner,oldLoser,key});
  duelNumber++;
  save();
  document.getElementById("message").textContent =
    "Ganadora: " + winner + " 🟢";
  renderRanking();
  setTimeout(nextDuel,450);
}
function undo() {
  const h = history.pop();
  if(!h) return;
  ratings[h.winner] = h.oldWinner;
  ratings[h.loser] = h.oldLoser;
  counts[h.winner]--;
  counts[h.loser]--;
  seen[h.key]--;
  duelNumber--;
  save();
  nextDuel();
  renderRanking();
}
function skip() {
  if(!current) return;
  seen[[...current].sort().join("|")] =
    (seen[[...current].sort().join("|")] || 0)+1;
  save();
  nextDuel();
}
function showTab(id,button) {
  document.querySelectorAll("section").forEach(s => s.classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
  document.querySelectorAll(".tabs button").forEach(b => b.classList.remove("active"));
  button.classList.add("active");
  if(id === "ranking") renderRanking();
  if(id === "songs") renderSongs();
}
function renderRanking() {
  const q = (document.getElementById("rankSearch").value || "").toLowerCase();
  const sorted = [...songs].sort((a,b) => ratings[b]-ratings[a]);
  document.getElementById("rankingList").innerHTML = sorted
    .filter(s => s.toLowerCase().includes(q))
    .map((s,i) => `
      <div class="ranking-item">
        <span><span class="rank">#${sorted.indexOf(s)+1}</span> ${s}</span>
        <span>${Math.round(ratings[s])} pts</span>
      </div>`).join("");
}
function renderSongs() {
  const q = (document.getElementById("songSearch").value || "").toLowerCase();
  document.getElementById("songList").innerHTML = songs
    .filter(s => s.toLowerCase().includes(q))
    .map((s,i) => `<div class="ranking-item">${i+1}. ${s}</div>`).join("");
}
function downloadCSV() {
  const sorted = [...songs].sort((a,b) => ratings[b]-ratings[a]);
  const csv = "Posición,Canción,Puntos,Duelo\\n" +
    sorted.map((s,i) =>
      `${i+1},"${s.replace(/"/g,'""')}",${Math.round(ratings[s])},${counts[s]}`
    ).join("\\n");
  const blob = new Blob(["\\uFEFF"+csv],{type:"text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "ranking-feid.csv";
  a.click();
  URL.revokeObjectURL(url);
}
load();
nextDuel();
renderRanking();
renderSongs();
</script>
</body>
</html>
